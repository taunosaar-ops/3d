<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pildist 3D-mudeliks (3D Print Prep)</title>
    <!-- Three.js 3D vaataja jaoks -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        h1 { font-size: 1.75rem; margin-bottom: 0.5rem; color: var(--text-main); }
        p.subtitle { color: var(--text-muted); margin-bottom: 2rem; font-size: 0.95rem; }
        
        .upload-section {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            margin-bottom: 1.5rem;
            background: rgba(15, 23, 42, 0.4);
            transition: border-color 0.2s;
        }
        .upload-section:hover { border-color: var(--accent); }
        input[type="file"] { display: none; }
        .file-upload-btn {
            display: inline-block;
            background: var(--accent);
            color: var(--bg-color);
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .file-upload-btn:hover { background: var(--accent-hover); }
        
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        @media (max-width: 600px) { .controls { grid-template-columns: 1fr; } }
        
        .control-group { display: flex; flex-direction: column; gap: 0.5rem; }
        label { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }
        input[type="number"], select {
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 1rem;
        }
        
        .action-btn {
            width: 100%;
            background: #10b981;
            color: white;
            font-weight: 600;
            padding: 0.85rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
            margin-bottom: 1.5rem;
        }
        .action-btn:hover { background: #059669; }
        
        #viewer-container {
            width: 100%;
            height: 400px;
            background: #020617;
            border-radius: 8px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .placeholder-text { color: var(--text-muted); font-size: 0.9rem; }
        
        .info-box {
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(56, 189, 248, 0.1);
            border-left: 4px solid var(--accent);
            border-radius: 0 6px 6px 0;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>3D Printimise Mudeli Valmistaja</h1>
    <p class="subtitle">Laadi üles pilt või 3D-fail, määra mõõdud ja vaata mudelit enne printimist.</p>
    
    <!-- Faili üleslaadimine -->
    <div class="upload-section">
        <p style="margin-bottom: 1rem; color: var(--text-muted);" id="file-name-display">Vali pilt (JPG/PNG) või 3D-mudel (STL)</p>
        <label class="file-upload-btn">
            Vali fail arvutist
            <input type="file" id="file-input" accept=".stl,.jpg,.png,.jpeg">
        </label>
    </div>

    <!-- Mõõdud ja seaded -->
    <div class="controls">
        <div class="control-group">
            <label for="target-height">Soovitud kõrgus (mm):</label>
            <input type="number" id="target-height" value="100" min="1">
        </div>
        <div class="control-group">
            <label for="output-format">Väljundformaat:</label>
            <select id="output-format">
                <option value="stl">STL (Standard)</option>
                <option value="obj">OBJ</option>
            </select>
        </div>
    </div>

    <button class="action-btn" id="process-btn">Töötle ja kuva 3D eelvaade</button>

    <!-- 3D Vaataja -->
    <div id="viewer-container">
        <span class="placeholder-text">3D eelvaade ilmub siia</span>
    </div>

    <div class="info-box">
        <strong>GitHubi märkus:</strong> Salvesta see fail nimega <code>index.html</code>, laadi oma GitHubi repositooriumisse ja lülita sisse <strong>GitHub Pages</strong>!
    </div>
</div>

<script>
    let uploadedFile = null;
    const fileInput = document.getElementById('file-input');
    const fileNameDisplay = document.getElementById('file-name-display');
    const viewerContainer = document.getElementById('viewer-container');

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            uploadedFile = e.target.files[0];
            fileNameDisplay.textContent = `Valitud fail: ${uploadedFile.name}`;
        }
    });

    let scene, camera, renderer;
    function initViewer() {
        viewerContainer.innerHTML = '';
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020617);

        camera = new THREE.PerspectiveCamera(45, viewerContainer.clientWidth / viewerContainer.clientHeight, 0.1, 1000);
        camera.position.set(0, 0, 200);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(viewerContainer.clientWidth, viewerContainer.clientHeight);
        viewerContainer.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(1, 1, 1).normalize();
        scene.add(directionalLight);

        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }

    document.getElementById('process-btn').addEventListener('click', () => {
        if (!uploadedFile) {
            alert('Palun vali enne fail!');
            return;
        }

        initViewer();

        const reader = new FileReader();
        if (uploadedFile.name.endsWith('.stl')) {
            reader.readAsArrayBuffer(uploadedFile);
            reader.onload = function (e) {
                const contents = e.target.result;
                const loader = new THREE.STLLoader();
                const geometry = loader.parse(contents);

                geometry.center();
                const material = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.4 });
                const mesh = new THREE.Mesh(geometry, material);
                scene.add(mesh);

                geometry.computeBoundingSphere();
                const sphere = geometry.boundingSphere;
                camera.position.set(0, 0, sphere.radius * 3);
            };
        } else {
            const geometry = new THREE.BoxGeometry(50, 50, 20);
            const material = new THREE.MeshStandardMaterial({ color: 0x10b981, roughness: 0.3 });
            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);
            alert('Pilt tuvastatud! (Märkus: Täielik pildist 3D-ks konverteerimine vajab Pythoni taustateenust või AI API-d, aga siin on näidisobjekt eelvaateks).');
        }
    });

    window.addEventListener('resize', () => {
        if (camera && renderer) {
            camera.aspect = viewerContainer.clientWidth / viewerContainer.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(viewerContainer.clientWidth, viewerContainer.clientHeight);
        }
    });
</script>

</body>
</html>
